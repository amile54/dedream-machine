name: Build & Release

on:
  workflow_dispatch:  # 手动触发：在 GitHub Actions 页面点 "Run workflow" 即可

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false  # 一个平台失败不影响另一个
      matrix:
        include:
          - platform: macos-14        # Apple Silicon (M1) runner
            target: aarch64-apple-darwin
            label: macOS-ARM
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ---- Windows: 下载 x64 版 FFmpeg & FFprobe ----
      - name: Download FFmpeg (Windows x64)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          $zipUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zipFile = "ffmpeg-win.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile
          Expand-Archive -Path $zipFile -DestinationPath ffmpeg-tmp -Force
          $binDir = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $binDir.FullName -Destination "src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe"
          $probeFile = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $probeFile.FullName -Destination "src-tauri/bin/ffprobe-x86_64-pc-windows-msvc.exe"
          Remove-Item $zipFile, ffmpeg-tmp -Recurse -Force
          Get-ChildItem src-tauri/bin/

      - name: Install frontend dependencies
        run: npm install

      # ---- macOS: 使用 npm 包里的 Apple Silicon sidecar ----
      - name: Install FFmpeg sidecars (macOS ARM)
        if: matrix.platform == 'macos-14'
        run: |
          mkdir -p src-tauri/bin

          cp "$(node -e "process.stdout.write(require('ffmpeg-static'))")" src-tauri/bin/ffmpeg-aarch64-apple-darwin
          cp "$(node -e "process.stdout.write(require('@derhuerst/ffprobe-static'))")" src-tauri/bin/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/bin/ffmpeg-aarch64-apple-darwin src-tauri/bin/ffprobe-aarch64-apple-darwin

          file src-tauri/bin/ffmpeg-aarch64-apple-darwin
          file src-tauri/bin/ffprobe-aarch64-apple-darwin
          file src-tauri/bin/ffmpeg-aarch64-apple-darwin | grep -q 'arm64'
          file src-tauri/bin/ffprobe-aarch64-apple-darwin | grep -q 'arm64'

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Package release asset (macOS)
        if: matrix.platform == 'macos-14'
        run: |
          mkdir -p release-assets
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.dmg' -exec cp {} release-assets/ \;
          ditto -c -k release-assets "DeDream-Machine-${{ matrix.label }}-${{ github.sha }}.zip"

      - name: Package release asset (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -Include *.exe,*.msi | Copy-Item -Destination release-assets
          Compress-Archive -Path "release-assets/*" -DestinationPath "DeDream-Machine-${{ matrix.label }}-${{ github.sha }}.zip" -Force

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: build-${{ github.run_id }}
          RELEASE_TITLE: DeDream Machine build ${{ github.run_id }}
          ASSET_NAME: DeDream-Machine-${{ matrix.label }}-${{ github.sha }}.zip
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "${{ github.sha }}" --title "$RELEASE_TITLE" --notes "Automated build from workflow run ${{ github.run_id }}."
          gh release upload "$RELEASE_TAG" "$ASSET_NAME" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeDream-Machine-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
